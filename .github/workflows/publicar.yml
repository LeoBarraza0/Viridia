# Publica el activo digital en GitHub Pages cada vez que se sube un cambio a main.
# Antes de publicar corre la prueba de coherencia: si el simulador deja de reproducir el PDF
# o algún identificador queda roto, no se publica.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prueba de coherencia (simulador e identificadores)
        run: node tests/verificar.js
      - name: Armar el sitio (solo los archivos que se publican)
        run: |
          mkdir _site
          cp -r index.html .nojekyll css js data img fonts vendor descargas _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
